[project]
name = "cv-basketball"
version = "0.1.0"
description = "Offline basketball video analysis: YOLO player/ball tracking, team assignment, court mapping."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "lap>=0.5.12",
]

[project.scripts]
cvb = "cv_basketball.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_basketball"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# ultralytics' inline hints are partial (e.g. Boxes | None everywhere); treat it as untyped.
[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights / real inference (deselect with -m 'not slow')"]
